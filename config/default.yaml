# Central configuration (spec section 7). One file, no thresholds hardcoded elsewhere.

# ─── Paths (not in spec section 7; the pipeline needs them to find its inputs) ──
paths:
  corpus_root: ../../Corpus-08052026/General/files
  seed_ontology: ../../qualitative_ontology.rdf
  work_dir: ../data              # SQLite stores, markdown, crops, reports
  reasoner_lib: ../lib           # OWL API, ELK, HermiT (scripts/fetch-jars.sh)
  # Pares de calibración: corpus publicado + su ontología, uno por subdirectorio con su
  # pair.yml. Todos los pares son instrumentos: el proyecto no tiene dominio comprometido, así
  # que un par se usa para medir el sistema y no al revés — ver calibration/README.md.
  calibration_root: ../../calibration

# ─── Profile and reasoning ───────────────────────────────
owl_profile:
  detected: auto          # computed in PREP-NORMALIZE-PROFILE
  target: OWL_DL_no_cardinality
reasoner:
  elk_filter_enabled: true
  elk_coverage_threshold: 0.7    # fraction of non-ignored axioms
  hermit_timeout_s: 120
upper_ontology: none      # none | skos | dolce_ultralite | bfo
                          # FIXED AT PROJECT START. Changing it = starting over.

# ─── Corpus and parsing ──────────────────────────────────
parser:
  born_digital: pymupdf
  scan: mineru
  uncertain: mineru
classification:
  min_visible_chars: 100
  garbled_ratio_threshold: 0.35
  image_coverage_scan_threshold: 0.65
boilerplate:
  page_frequency_threshold: 0.8
  bbox_tolerance_px: 12
  normalize_before_compare: [digits, ips, dates]
  max_block_chars: 200   # running heads are short; a long recurring paragraph is body text

extraction:
  max_mention_words: 8   # a mention is a noun phrase; a clause is an extraction error

# Puenteo por conocimiento del mundo (ITER-BRIDGE), entre el tipado y la inducción. Sin esta etapa,
# cada mención que la semilla sí cubría pero el matcher no conectó se convierte en una clase
# inducida espuria: el falso huérfano alimentando al inductor.
bridging:
  n_candidates: 5              # clases ofrecidas al modelo por cada forma superficial
  min_candidate_score: 0.45    # por debajo, no se pregunta: ofrecer cinco clases ninguna
                               # cercana invita a la conexión forzada. Deliberadamente más bajo
                               # que grey_zone_lower — la etapa existe para alcanzar relaciones
                               # que el encoder no ve. Medido sobre las 686 huérfanas de v2:
                               # 0,30 → 582 preguntas (98% de las huérfanas), 0,45 → 403 (70%),
                               # 0,60 → 183 (33%). Sin calibrar, como todo umbral acá.

induction:
  similarity_threshold: 0.75   # single-link sobre las menciones huérfanas
  min_support: 3               # una mención proponiendo una clase es ruido (ITER-BRANCH)
  max_phrases_in_prompt: 30
  # Desde qué parecido con una clase existente una propuesta es duplicado, o sea que sus
  # menciones eran falsos huérfanos. No se descarta sola: es el diagnóstico del matcher que pide
  # la compuerta de BUILD-NO-GO-GATE. Medido sobre MaterioMiner: 5 de 45 propuestas por encima de 0,90, con
  # `Test specimen` en 1,00 contra una clase idéntica que el matcher no encontró.
  redundant_threshold: 0.90

chunking:
  target_chars: 3000     # a chunk is ITER-EXTRACT's unit of extraction
  max_chars: 6000        # a table is atomic and may exceed this

# ─── Seed normalization (PREP-NORMALIZE) ─────────────────────────────
seed:
  base_iri: https://ontology.local/id/   # opaque IRIs; the original is kept as provenance
  label_divergence_threshold: 0.8        # below it, a label pair is flagged, not assumed
                                         # to be a translation

# ─── Matching and entity resolution ──────────────────────
matching:
  # Barrido sobre CRAFT/CL (`onto-pipeline calibrate craft-cl`), 8.723 menciones. El F1 de
  # tipado tiene su máximo en 0,774 con el corte en 0,90, y 0,92 está prácticamente ahí: los
  # defaults del spec resultaron bien puestos para este par. Lo que el F1 no dice es que en ese
  # punto la tasa de falsos huérfanos es 26,3%, contra 4,7% en 0,70 — pero con 2.300 mal
  # tipados que en 0,90 son 563. Cuál de los dos errores duele más es decisión de diseño (un
  # falso huérfano induce clases espurias en ITER-INDUCE), no algo que el barrido pueda resolver.
  # Advertencia de lectura: el barrido usa UN corte, el pipeline usa dos. Mide el corte de
  # huérfano; dónde parte auto de zona gris es la pregunta separada de cuánta revisión humana
  # se está dispuesto a hacer, y eso no se calibra contra un corpus.
  # MEDIDOS, no los defaults del spec. Barrido sobre craft-cl: 8.723 menciones gold contra
  # 3.418 clases candidatas, bi-encoder, match_against=label.
  #   umbral  precisión  recall     F1
  #     0.70     72,3%    68,9%   0,706   <- el default del spec: 3 de cada 10 aceptadas, mal
  #     0.80     82,9%    68,5%   0,750
  #     0.90     91,2%    67,2%   0,774   <- pico de F1
  #     0.95     97,9%    58,0%   0,729
  # El recall casi no se mueve entre 0,30 y 0,90 (69,8% -> 67,2%): el ranking ya es correcto y
  # el umbral solo filtra mistypes. Por eso subir es casi gratis en recall y caro en huérfanas.
  # auto_merge = la barra para fusionar SIN preguntar -> precisión ≥95%.
  # grey_zone_lower = por debajo se descarta como huérfana, que es el error que el spec dice
  # que más cuesta; se elige por debajo del pico de F1 para mandar la duda al usuario, que la
  # recupera, en vez de perderla.
  # Barrido con `--holdout 0.2` (683 de 3.418 clases retenidas, determinista): las menciones de
  # una clase retenida son huérfanas genuinas cuya respuesta correcta se conoce. 546 de las
  # 8.723 menciones caen ahí, y es lo único que la corrida sin holdout no podía medir.
  # Dónde cae una mención de un concepto que la ontología NO tiene, con estos dos cortes:
  #   >= 0,95  fusionada en silencio contra una clase equivocada .....  15  (2,7%)
  #   0,80-0,95 zona gris: llega a revisión, recuperable ............. 398 (72,9%)
  #   <  0,80  huérfana: llega a inducción, que es su destino .......  133 (24,4%)
  # Las dos zonas juntas atajan el 97,3%: el diseño de tres zonas hace lo que promete, y el
  # error caro —fusionar en silencio un concepto nuevo contra uno viejo— es marginal.
  # Precaución al comparar con la tabla de arriba: el holdout achica el inventario a 2.736
  # clases, y con menos distractores la precisión sube (99,2% en 0,95, 87,4% en 0,80 sobre las
  # menciones cubiertas). Los números que quedan arriba son los del inventario completo, que es
  # el caso más duro. La tasa de falsos huérfanos casi no se mueve (18,0% vs 17,3% en 0,80),
  # porque sólo 546 de 8.723 menciones cambiaron de lado.
  auto_merge_threshold: 0.95
  grey_zone_lower: 0.80
  # Nunca medido: los cuatro pares de calibración disponibles son en inglés. Ver deuda 17.
  cross_language_always_grey: true
  # embedding | surface_and_keys. Under `embedding`, candidates are pairs at or above
  # grey_zone_lower plus what the ontology asserts (same surface, same declared key value,
  # declared synonym) — no constant of its own. Measured on 848 mentions: 5.436 candidate
  # pairs in 0,33 s against 6.531 pairs in 44,9 s for the surface heuristic, which also split
  # `in-depth interview` from `semi-structured interview`.
  blocking_strategy: embedding
  respect_declared_haskey: true
  # Multilingual by requirement: a monolingual encoder would push every es/en pair into the
  # grey zone on language alone.
  bi_encoder: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  cross_encoder: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  match_against: label             # label | gloss | label_and_gloss
                                   # SETTLED, against the spec (6.2), which matches on the
                                   # gloss. Measured on CRAFT/CL: 8.723 gold mentions against
                                   # 3.418 classes, 96% of them carrying a real definition —
                                   # the condition under which the spec's premise should have
                                   # won. recall@1: label 6.090 (69,8%), label_and_gloss 1.161
                                   # (13,3%), gloss 686 (7,9%). It is not only recall. The gap
                                   # between the score of a right top-1 and a wrong one, in
                                   # pooled standard deviations: label +1,61 — and gloss -0,42,
                                   # label_and_gloss -0,49. NEGATIVE: with glosses the wrong
                                   # answers score HIGHER than the right ones, so no threshold
                                   # helps and a higher one preferentially keeps the errors.
                                   # A mention is a short noun phrase and so is a label; a
                                   # gloss is a sentence, and a symmetric encoder loses more on
                                   # that difference in shape than it gains in meaning.
                                   # Revisit with an asymmetric encoder, not with a threshold.
  # OFF **de fábrica**: separación -0,50, F1 0,127 contra 0,774 del bi-encoder. No es que haga
  # falta otro umbral; el orden que produce está anticorrelacionado con el correcto.
  #
  # ON cuando hay uno **ajustado a este dominio**. `onto-pipeline tune <par> --out <dir>` lo
  # entrena, y después se apunta `cross_encoder` a ese directorio y se pone esto en `true`.
  # Medido sobre documentos no vistos: +9,9 puntos en CRAFT (66,3% -> 76,2%, el 88% del margen
  # disponible) y +11,6 en MaterioMiner. Es la mejora más grande que se midió acá.
  # Lo que NO se puede hacer es reutilizarlo entre dominios: el de CRAFT aplicado a
  # MaterioMiner da -2,1 puntos, peor que no usar ninguno.
  use_cross_encoder: false         # Same run, re-ranking the bi-encoder's top-5:
                                   # recall@1 falls from 6.090 to 2.220 and the separation goes
                                   # to -0,56 (right top-1 median 0,143, wrong 0,325). It both
                                   # ranks worse and scores the errors higher, and it squashes
                                   # everything into ~0,1-0,3, which is the RISKS-FALSE-ORPHANS failure the spec
                                   # names: a 0,73 match becomes a false orphan. A generic IR
                                   # re-ranker is the wrong instrument here; it earns its place
                                   # only tuned on accumulated accept/reject labels (6.3).
  device: null                     # null lets torch choose; "cuda" or "cpu" to force

# Enriquecimiento de glosas desde el corpus (ITER-AXIOMATIZE ITER-AXIOMATIZE-ENRICH, PREP-NORMALIZE). Los pasajes se encuentran por
# señal definitoria —"X es un", "X se define como", "también llamado"— y no preguntándole a un
# modelo cuáles son definitorios: un corpus tiene muchos más párrafos que presupuesto tiene
# pedidos, y un filtro que cuesta un pedido por párrafo no es un filtro.
enrichment:
  max_passages: 6          # por clase, repartidos entre documentos antes de profundizar
  max_passage_chars: 1200
  min_passages: 1          # sin pasajes no se pregunta; inventar una glosa no es enriquecer

# ─── Ajuste del re-ranker (ITER-TUNE) ─────────────────────────
# El modelo que se ajusta es `matching.cross_encoder`, o sea que es configurable y esto no está
# atado a ninguno en particular. De su tamaño depende el método:
#   full  todos los pesos. Mejor resultado, memoria proporcional al modelo. Con el de fábrica
#         (117M de parámetros) son 79 s en una GPU de notebook.
#   lora  pesos base congelados y matrices de rango bajo en la atención: 443 mil parámetros
#         entrenables sobre ese mismo modelo, el 0,38%. Es lo que permite ajustar uno grande.
#   auto  completo por debajo de `full_max_params`, LoRA por encima.
# Medido (documentos no vistos): +9,9 puntos en CRAFT, +11,6 en MaterioMiner. Un modelo ajustado
# en un dominio aplicado a otro da -2,1: hay que ajustar uno por dominio.
tuning:
  method: auto
  full_max_params: 150000000   # política sobre esta máquina, no una verdad sobre los modelos
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  epochs: 1
  lora_epochs: 12              # LoRA mueve menos pesos y necesita más pasos: 1 época da -6,3
                               # puntos, 4 dan -5,4 y 12 dan +7,0. Igualarlas es concluir mal.
  batch_size: 64
  max_length: 64
  negatives: 4                 # por mención, de clases que el bi-encoder puso arriba y estaban mal
  top_k: 10                    # cuántas reordena el cross-encoder al usarse
  negative_pool: 50            # de cuántas se sacan los negativos al entrenar. Más ancho que
                               # top_k a propósito: entrenar sólo contra las que va a puntuar
                               # generaliza peor. Medido +11,2 contra +10,4 (n=653, evidencia
                               # débil pero gratis). Sacar las menciones cuya clase no está en
                               # el top_k —el 57%— no cambia nada: +10,0.
  train_fraction: 0.8          # partición POR DOCUMENTO, no por mención

# ─── Criterios de parada (EVAL-STOPPING) ─────────────────────────
# Dos terminaciones distintas: de iteración (¿esta ronda se agotó?) y de proceso (¿la ontología
# está lista?). Siendo incremental, la segunda es "suficiente hasta que lleguen documentos
# nuevos". El criterio primario es `cq.target_pass_rate` y el duro `iteration.max_iterations`;
# no se repiten acá para que cada uno tenga un solo lugar donde cambiarse.
# La cobertura de menciones NO es criterio de parada a propósito: el sistema optimiza lo que se
# mide, y una clase paraguas maximiza cobertura destruyendo el valor conceptual. Es diagnóstico.
stopping:
  novelty_window: 5        # documentos que mira la saturación
  novelty_threshold: 1.0   # conceptos nuevos por documento por debajo de los cuales satura

# ─── Ramas (ITER-BRANCH) ────────────────────────────────────────
# El multi-rama es el camino excepcional, no el default: preguntar en cada iteración sin
# conflicto real es exactamente el trabajo manual que el pipeline existe para evitar (AUTO-APPLY-WHEN-NO-AXES).
# Ningún eje sale de un modelo — la única prohibición explícita del spec para esta etapa es
# pedirle al LLM "dame 3 alternativas". Salen del razonador y de un catálogo enumerado.
branching:
  max_branches: 5                    # techo práctico del spec: pasadas cinco no se comparan
  present_independent_axes_separately: true   # k ejes binarios son k preguntas, no 2^k ramas
  auto_apply_when_no_axis: true
  min_group: 2                       # una subclase calificada es una clase; varias, un eje
  # El eje de criterio de división no tiene umbral de similitud: el corte se elige por padre,
  # porque cuán parecidos se leen dos criterios depende de cómo los escribieron, no de una
  # constante. Esto es cuánto más nítido tiene que ser ese corte que las similitudes que
  # rompe. Sin calibrar; medido sólo sobre seis criterios escritos a mano, donde el par que
  # sí era un corte estaba en 0,38 y el ruido cruzado en 0,25.
  min_criterion_separation: 0.10

# ─── Mapping rules: mention layer -> ABox ────────────────
# La política global. Las excepciones por caso viven en `review_items`, no acá: ITER-CONFLICTS les da
# alcance por caso y ITER-APPLY recomputa el ABox entero, así que no pueden vivir dentro del código
# que recomputa. Ver plan_reglas_de_mapeo.md.
mapping:
  individual_from: entity      # entity (componente de fusión) | mention (sólo diagnóstico)
  type_from: [auto]            # zonas que producen rdf:type. La gris no tipa hasta que la
                               # contestás: es la política conservadora de ITER-MATCH en el ABox.
  provenance: named_graph      # named_graph (uno por documento) | flat
  conflict_policy: notarize    # notarize | force | refute — ITER-CONFLICTS. Notarizar es el único que
                               # no destruye información, y es el default silencioso del spec.
  duplicate_policy: separate   # separate | merge. Separados y marcados, fuera del conteo de
                               # soporte funcional (ITER-APPLY).
  # A partir de cuántas entidades un par de clases que choca deja de ser casos y pasa a ser
  # UNA pregunta sobre la TBox (ITER-CONFLICTS). Contextualizar una propiedad cambia la forma de todas
  # las consultas sobre ella, incluidas las SPARQL de las CQ, así que esa pregunta es un eje
  # de `branch` y no una decisión por caso acá. Sin calibrar.
  conflict_pattern_threshold: 3
  # Por debajo de estos individuos no se pregunta si una propiedad es funcional (ITER-APPLY): la
  # respuesta se apoyaría en evidencia demasiado flaca, y preguntar igual entrena a la persona
  # a decir que sí. "1 valor en 3 individuos" y "1 valor en 400" son la misma señal cualitativa
  # y decisiones opuestas — por eso la distribución va en la pregunta, no sólo la conclusión.
  functional_min_individuals: 5

# ─── Iteration ───────────────────────────────────────────
iteration:
  mode: global            # global | incremental
  cache_extraction: true
  trigger: manual         # manual | per_document | batch_of_n
  batch_size: 5
  max_iterations: 20      # hard stopping criterion
  # What to do with documents already processed, when a prompt version, threshold or chunking
  # change invalidated their cache. A document never processed is always processed; this
  # governs re-processing only, which is where the bill is.
  reload: all             # all | none | sample
  reload_sample: 0.2      # fraction of the already-processed ones, when reload: sample
  reload_seed: 0          # seeded, so two runs of one configuration pick the same documents

# ─── Competency questions ────────────────────────────────
cq:
  n_candidates: 60
  type_quota: {definitional: 8, relational: 12, restrictive: 8,
               quantificational: 6, inferential: 10, negative: 6}
  sparql_regeneration: on_class_change
  target_pass_rate: 0.90

# ─── Branches ────────────────────────────────────────────
branching:
  max_branches: 5
  present_independent_axes_separately: true
  auto_apply_when_no_axis: true

# ─── Models and temperature (per stage) ──────────────────
llm:
  provider: openai_compatible
  # OpenCode Go:  https://opencode.ai/zen/go/v1   (OPENCODE_API_KEY)
  # Ollama local: http://127.0.0.1:11434/v1       (no key)
  base_url: https://opencode.ai/zen/go/v1
  api_key_env: OPENCODE_API_KEY   # the NAME of the variable. The key itself lives in
                                  # opencode.env, which is gitignored; pass --env-file.
  models:                 # tier -> model id
    small:  glm-5.3-flash
    medium: deepseek-v4-flash
    large:  glm-5.2
  # MEASURED COST, and it is not what input tokens suggest. Every model on this gateway is a
  # reasoning model, and the reasoning is billed as output: ITER-EXTRACT over one 11-page paper spent
  # 34,549 in and 505,443 out — a ratio of 14.6x — which is $0.34 for that document and about
  # $34 for a pass over 100. An earlier estimate of $0.23 counted input only and was wrong by
  # two orders of magnitude. Extraction is not a reasoning task; the small tier is ~3x cheaper
  # and worth trying for ITER-EXTRACT before paying this.
  # reasoning_effort: extraction and classification do not need a chain of thought;
  # axiomatization and branching do. Measured on this gateway, 'low' cut reasoning
  # tokens from 148 to 2 on a trivial extraction.
  prep_normalize_labels:        {tier: small,  temperature: 0.0, reasoning_effort: low}
  prep_normalize_glosses:       {tier: medium, temperature: 0.3}
  prep_cq_generated:   {tier: large,  temperature: 0.3}
  iter_extract:      {tier: small,  temperature: 0.0, reasoning_effort: low}
  iter_corefer:    {tier: medium, temperature: 0.0, reasoning_effort: low}
  iter_match:        {tier: small,  temperature: 0.0, reasoning_effort: low}
  iter_bridge:       {tier: large,  temperature: 0.3}
  iter_induce:          {tier: large,  temperature: 0.3}
  iter_axiomatize:  {tier: large,  temperature: 0.7}
  iter_axiomatize_enrich:     {tier: medium, temperature: 0.3}
  # Metapropiedades de OntoClean. Temperatura 0: no es una pregunta creativa, y la misma clase
  # tiene que dar la misma respuesta en dos corridas o el filtro 4 deja de ser determinista.
  iter_validate_ontoclean:       {tier: large,  temperature: 0.0}
  iter_branch:       {tier: large,  temperature: 0.3}
  regeneration_retry: {tier: large,  temperature: 0.7}

# ─── Execution ───────────────────────────────────────────
execution:
  max_retries: 3
  backoff_base_s: 2
  stage_failure_rate_abort: 0.10
