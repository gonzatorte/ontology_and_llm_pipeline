[project]
name = "onto-pipeline"
version = "0.1.0"
description = "LLM-assisted ontology enrichment pipeline (see especificacion_pipeline_ontologia.md)."
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "rdflib>=7.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.4",
]
reasoning = [
    "jpype1>=1.7.1",
]
matching = [
    "sentence-transformers>=6.0.1",
]

[project.scripts]
onto-pipeline = "onto_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onto_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
