[project]
name = "onto-pipeline"
version = "0.1.0"
description = "LLM-assisted ontology enrichment pipeline (see main_plan.md)."
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "rdflib>=7.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "httpx>=0.28.1",
    # boto3 tampoco es opcional: S3 es el único sustrato de artefactos, y toda etapa escribe
    # alguno. En local eso es MinIO, que habla la misma API.
    "boto3>=1.35",
    # No es opcional: `postgres` es el único motor soportado en runtime. SQLite quedó para los
    # tests, y ése viene con Python.
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.4",
]
reasoning = [
    "jpype1>=1.7.1",
]
matching = [
    "sentence-transformers>=6.0.1",
    # Sólo para el ajuste del re-ranker (spec 6.3): `CrossEncoder.fit` los pide. La
    # recuperación y el re-ranking sin entrenar no los necesitan.
    "datasets>=3.0",
    "accelerate>=1.1.0",
    # LoRA, para ajustar un re-ranker que no entra entero en memoria.
    "peft>=0.13",
]
# B5 filter 3. Optional because the filter reports SKIPPED without shapes anyway, and shapes
# are written by hand: OWL says what must be true, SHACL what must be stated, and under the
# open-world assumption generating one from the other turns every silence into a violation.
validation = [
    "pyshacl>=0.26.0",
]
# La interfaz REST y lo que necesita para desplegarse. Opcional porque el CLI y el wizard no la
# usan, y la imagen no tiene por qué cargarla para correr una etapa suelta. boto3 va acá porque
# el backend S3 de `objectstore.py` es lo que hace que los artefactos sobrevivan al contenedor.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
onto-pipeline = "onto_pipeline.interfaces.cli:entrypoint"
# La API es su propio comando: el de arriba es para enriquecer una ontología, éste para
# levantar y administrar un despliegue. Necesita el extra `api`.
onto-pipeline-api = "onto_pipeline.interfaces.api.admin:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onto_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
