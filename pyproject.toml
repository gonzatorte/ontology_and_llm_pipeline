[project]
name = "onto-pipeline"
version = "0.1.0"
description = "LLM-assisted ontology enrichment pipeline (see main_plan.md)."
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "rdflib>=7.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.4",
]
reasoning = [
    "jpype1>=1.7.1",
]
matching = [
    "sentence-transformers>=6.0.1",
    # Sólo para el ajuste del re-ranker (spec 6.3): `CrossEncoder.fit` los pide. La
    # recuperación y el re-ranking sin entrenar no los necesitan.
    "datasets>=3.0",
    "accelerate>=1.1.0",
    # LoRA, para ajustar un re-ranker que no entra entero en memoria.
    "peft>=0.13",
]
# Dos sesiones de usuario escribiendo a la vez. SQLite da un escritor y muchos lectores, que
# alcanza para una sesión por vez; para dos hace falta esto. Opcional porque la suite entera
# corre contra SQLite y no necesita servidor.
postgres = [
    "psycopg[binary]>=3.2",
]
# B5 filter 3. Optional because the filter reports SKIPPED without shapes anyway, and shapes
# are written by hand: OWL says what must be true, SHACL what must be stated, and under the
# open-world assumption generating one from the other turns every silence into a violation.
validation = [
    "pyshacl>=0.26.0",
]

[project.scripts]
onto-pipeline = "onto_pipeline.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onto_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
